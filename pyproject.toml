[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drawio-structurizr"
version = "0.2.0"
description = "Validate C4 draw.io diagrams and convert them to Structurizr DSL and Excel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amit Kumar" }]
requires-python = ">=3.9"
keywords = ["c4", "c4-model", "drawio", "draw.io", "structurizr", "architecture", "diagrams"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["xlsxwriter>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/veritas-sovereign/drawio-structurizr"
Changelog = "https://github.com/veritas-sovereign/drawio-structurizr/blob/main/CHANGELOG.md"

[project.scripts]
drawio-structurizr = "drawio_structurizr.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
