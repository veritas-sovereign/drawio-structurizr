name: publish-image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, "src/**", .github/workflows/publish-image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: drawio-structurizr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Convert, validate and export a sample inside the image
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/examples:/work" drawio-structurizr:test \
            shop.drawio multipage.drawio -o merged.dsl -d --strict --validate --export mermaid --export-dir out
          test -s examples/merged.dsl
          ls examples/out/*.mmd

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
