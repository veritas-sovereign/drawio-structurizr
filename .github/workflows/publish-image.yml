name: publish-image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, "src/**", .github/workflows/publish-image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: drawio-structurizr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Convert, validate and export a sample inside the image
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/examples:/work" drawio-structurizr:test \
            shop.drawio -o shop.dsl -d --strict --validate-required
          test -s examples/shop.dsl
          # the two samples disagree on Order API's technology, so merging them warns (C4-MERGE-003): no --strict
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/examples:/work" drawio-structurizr:test \
            shop.drawio multipage.drawio -o merged.dsl -d --validate-required --export mermaid --export-dir out
          test -s examples/merged.dsl
          ls examples/out/*.mmd
      - name: --check (the pre-commit hook) exits 1 on problems and writes nothing
        run: |
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/examples:/work" drawio-structurizr:test \
            broken.drawio -d --check
          status=$?
          set -e
          echo "exit code: $status"
          test "$status" -eq 1
          test ! -e examples/workspace.dsl
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/examples:/work" drawio-structurizr:test \
            shop.drawio -d --check
      - name: The README's Docker pre-commit hook command validates .dsl files
        run: |
          cp examples/merged.dsl examples/copy.dsl
          printf 'workspace {\n model {\n  a = person "A"\n  a -> missing "x"\n }\n}\n' > examples/bad.dsl
          hook() {
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/examples:/src" --workdir /src \
              --entrypoint sh drawio-structurizr:test \
              -c 'for f in "$@"; do structurizr-cli validate -workspace "$f" || exit 1; done' -- "$@"
          }
          hook merged.dsl copy.dsl
          if hook merged.dsl bad.dsl; then echo "invalid workspace was accepted"; exit 1; fi

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
