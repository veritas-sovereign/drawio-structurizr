version: 2
updates:
  # Base image digest in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # stay on Python 3.12 / Debian bookworm unless changed on purpose
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Versions of the actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
